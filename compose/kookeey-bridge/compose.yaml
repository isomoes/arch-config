# kookeey-bridge — local proxies that forward to Kookeey SOCKS5 gateways,
# managed via Docker Compose.
#
# Three gost services listen on 127.0.0.1:10011 (HTTP), :10012 (SOCKS5),
# and :10013 (HTTP/SOCKS5 with automatic protocol detection).
# Each forwards through its own authenticated SOCKS5 endpoint at
# gate.kookeey.info. Point anything that should egress via Kookeey at one of
# these proxies, e.g.
#
#   export HTTPS_PROXY=http://127.0.0.1:10011 HTTP_PROXY=http://127.0.0.1:10011
#
# Networking: this host's Docker *bridge* network has no outbound egress — a
# host-level routing quirk where forwarded/NAT'd container traffic never leaves,
# even though the host itself reaches the internet fine (restarting dockerd does
# not fix it). So gost runs with network_mode: host and reaches the Kookeey
# gateway through the working host network. Host mode ignores `ports:`, so the
# loopback-only binds live in -L itself — the proxies stay reachable only from
# this host, never the LAN.
#
# Credentials: the upstream URLs carry the Kookeey username/password, so they
# are NOT in this file. They live in compose/kookeey-bridge/.env (gitignored) as
# KOOKEEY_UPSTREAM, KOOKEEY_UPSTREAM_10012 and KOOKEEY_UPSTREAM_10013.
# Compose auto-loads this file from the compose file's own directory.
# Set it up once:
#
#   cd compose/kookeey-bridge && cp .env.example .env && $EDITOR .env
#   docker compose -f compose/kookeey-bridge/compose.yaml up -d
#
# KOOKEEY_UPSTREAM format (PORT is the gateway port Kookeey assigned you):
#   socks5://USERNAME:PASSWORD@gate.kookeey.info:PORT
services:
  kookeey-bridge:
    image: gogost/gost
    container_name: kookeey-bridge
    restart: unless-stopped
    network_mode: host
    command:
      - "-L=http://127.0.0.1:10011"   # loopback-only HTTP proxy (host netns; no `ports:` in host mode)
      # Forward to the Kookeey SOCKS5 gateway. Creds come from .env, never git;
      # :? makes compose abort with this message if .env is missing/unset.
      - "-F=${KOOKEEY_UPSTREAM:?set KOOKEEY_UPSTREAM in compose/kookeey-bridge/.env (see .env.example)}"

  kookeey-bridge-10012:
    image: gogost/gost
    container_name: kookeey-bridge-10012
    restart: unless-stopped
    network_mode: host
    command:
      - "-L=socks5://127.0.0.1:10012"
      - "-F=${KOOKEEY_UPSTREAM_10012:?set KOOKEEY_UPSTREAM_10012 in compose/kookeey-bridge/.env (see .env.example)}"

  kookeey-bridge-10013:
    image: gogost/gost
    container_name: kookeey-bridge-10013
    restart: unless-stopped
    network_mode: host
    command:
      - "-L=auto://127.0.0.1:10013"
      - "-F=${KOOKEEY_UPSTREAM_10013:?set KOOKEEY_UPSTREAM_10013 in compose/kookeey-bridge/.env (see .env.example)}"
